<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker - Analytics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .header .date {
            color: #888;
            font-size: 0.95em;
        }

        .discipline-score {
            text-align: center;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 20px;
            border-radius: 20px;
            min-width: 160px;
            position: relative;
        }

        .discipline-label {
            font-size: 0.65em;
            color: #666;
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .discipline-value {
            font-size: 2.8em;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 6px;
            position: relative;
        }

        .discipline-value::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #2a2a2a;
            z-index: -1;
        }

        .discipline-progress-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            z-index: -1;
        }

        .discipline-progress-ring circle {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 1s ease;
        }

        .discipline-progress-bg {
            stroke: #2a2a2a;
        }

        .discipline-rank {
            font-size: 1.1em;
            color: #fff;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .discipline-rank-emoji {
            font-size: 1.2em;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
        }


        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card-small {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #2a2a2a;
        }

        .stat-card-small .label {
            color: #888;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-card-small .value {
            font-size: 2em;
            font-weight: 600;
        }

        .stat-card-small.stat-exceeding {
            animation: glow 2s ease-in-out infinite;
            border: 1px solid rgba(76, 217, 100, 0.3);
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(76, 217, 100, 0.2);
            }
            50% {
                box-shadow: 0 0 30px rgba(76, 217, 100, 0.4);
            }
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .analytics-card {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #2a2a2a;
            position: relative;
            overflow: hidden;
        }

        .analytics-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 0.95em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-trend {
            font-size: 0.9em;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 500;
        }

        .card-trend.positive {
            background: rgba(76, 217, 100, 0.15);
            color: #4cd964;
        }

        .card-trend.negative {
            background: rgba(255, 59, 48, 0.15);
            color: #ff3b30;
        }

        .card-trend.neutral {
            background: rgba(136, 136, 136, 0.15);
            color: #888;
        }

        .card-value {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1;
        }

        .card-subtitle {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        .chart-container {
            width: 100%;
            height: 80px;
            position: relative;
        }

        .mini-chart {
            width: 100%;
            height: 100%;
        }

        .habits-section {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #2a2a2a;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.3em;
            font-weight: 600;
        }

        .habit-item {
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            transition: all 0.2s;
            cursor: pointer;
        }

        .habit-item:hover {
            border-color: #667eea;
            transform: translateX(4px);
        }

        .habit-item.completed {
            background: rgba(102, 126, 234, 0.1);
            border-color: #667eea;
        }

        .habit-checkbox {
            width: 28px;
            height: 28px;
            border: 2px solid #667eea;
            border-radius: 8px;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .habit-checkbox.checked {
            background: #667eea;
        }

        .habit-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .habit-info {
            flex: 1;
        }

        .habit-name {
            font-size: 1em;
            font-weight: 500;
        }

        .habit-mini-progress {
            width: 100px;
            height: 24px;
            margin-left: 12px;
            flex-shrink: 0;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .spinner {
            border: 3px solid #2a2a2a;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1a1a;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            z-index: 1000;
            max-width: 300px;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            border-color: #4cd964;
        }

        .toast.error {
            border-color: #ff3b30;
        }

        @media (max-width: 768px) {
            .analytics-grid {
                grid-template-columns: 1fr;
            }

            .stats-overview {
                grid-template-columns: repeat(2, 1fr);
            }

            .card-value {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h1>Habits</h1>
                    <div class="date" id="dateDisplay">Loading...</div>
                </div>
                <div class="discipline-score" id="disciplineScore">
                    <div class="discipline-label">DISCIPLINE SCORE</div>
                    <div style="position: relative; display: inline-block;">
                        <svg class="discipline-progress-ring" width="100" height="100">
                            <circle class="discipline-progress-bg" cx="50" cy="50" r="45"></circle>
                            <circle class="discipline-progress-fill" id="progressCircle" cx="50" cy="50" r="45" 
                                    stroke-dasharray="283" stroke-dashoffset="283"></circle>
                        </svg>
                        <div style="position: relative; z-index: 1; padding: 20px 0;">
                            <div class="discipline-value" id="disciplineValue">---</div>
                        </div>
                    </div>
                    <div class="discipline-rank">
                        <span class="discipline-rank-emoji" id="disciplineEmoji">🌱</span>
                        <span id="disciplineRank">Calculating...</span>
                    </div>
                </div>
            </div>
        </div>



        <div class="stats-overview">
            <div class="stat-card-small">
                <div class="label">Today</div>
                <div class="value" id="todayStats">-/-</div>
            </div>
            <div class="stat-card-small">
                <div class="label">Rate</div>
                <div class="value" id="rateStats">-%</div>
            </div>
            <div class="stat-card-small">
                <div class="label">Weekly</div>
                <div class="value" id="weeklyGoalStats">-%</div>
            </div>
            <div class="stat-card-small">
                <div class="label">Monthly</div>
                <div class="value" id="monthlyGoalStats">-%</div>
            </div>
        </div>

        <div class="analytics-grid" id="analyticsGrid">
            <div class="loading">
                <div class="spinner"></div>
                Configure API key to view analytics
            </div>
        </div>

        <div class="habits-section">
            <div class="section-header">
                <div class="section-title">Today's Habits</div>
                <button class="btn" id="refreshBtn" onclick="loadData()">↻ Refresh</button>
            </div>
            <div id="habitsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading habits...
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyzWHIhZ1m5ab-a5m16vmhOzZJAzXYXIVZP5Q9ZFIGw-8GfZ974_TghRHuyInjKDckDxw/exec';
        let API_SECRET = localStorage.getItem('habitApiSecret') || 'your_secret_key_here';
        let currentData = null;

        window.addEventListener('DOMContentLoaded', () => {
            loadData(); // Auto-load with hardcoded key
        });

        async function loadData() {
            if (!API_SECRET) {
                showToast('Please enter your API secret key first', 'error');
                return;
            }

            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.disabled = true;
            refreshBtn.textContent = '⏳ Loading...';

            try {
                const response = await fetch(`${API_URL}?api_secret=${encodeURIComponent(API_SECRET)}`);
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.message || 'Failed to load data');
                }

                currentData = data;
                displayData(data);
                showToast('Data loaded successfully!', 'success');
            } catch (error) {
                console.error('Error loading data:', error);
                showToast(error.message, 'error');
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = '↻ Refresh';
            }
        }

        function displayData(data) {
            updateDateDisplay(data.date);
            updateStatsOverview(data);
            updateDisciplineScore(data);
            updateAnalyticsCards(data);
            displayHabits(data);
        }

        function calculateDisciplineScore(historicHabits, currentDay) {
            const allHabits = Object.values(historicHabits);
            if (allHabits.length === 0 || currentDay === 0) return { score: 0, rank: 'Beginner' };

            let score = 300; // Start at 300 (like CIBIL starts at 300)
            
            // Factor 1: Overall consistency (40% weight) - Max +280 points
            let totalChecks = 0;
            let totalPossible = 0;
            allHabits.forEach(habit => {
                for (let i = 0; i < currentDay; i++) {
                    totalPossible++;
                    if (habit[i] === 1) totalChecks++;
                }
            });
            const consistencyRate = totalPossible > 0 ? (totalChecks / totalPossible) : 0;
            score += Math.round(consistencyRate * 280);

            // Factor 2: Streak bonus (20% weight) - Max +140 points
            let longestStreak = 0;
            let currentStreak = 0;
            for (let day = 0; day < currentDay; day++) {
                let allComplete = true;
                allHabits.forEach(habit => {
                    if (habit[day] !== 1) allComplete = false;
                });
                if (allComplete) {
                    currentStreak++;
                    longestStreak = Math.max(longestStreak, currentStreak);
                } else {
                    currentStreak = 0;
                }
            }
            const streakBonus = Math.min(140, longestStreak * 5); // 5 points per day, max 140
            score += streakBonus;

            // Factor 3: Recent performance (20% weight) - Max +140 points
            const last7Days = Math.min(7, currentDay);
            let recentTotal = 0;
            let recentPossible = 0;
            allHabits.forEach(habit => {
                for (let i = Math.max(0, currentDay - last7Days); i < currentDay; i++) {
                    recentPossible++;
                    if (habit[i] === 1) recentTotal++;
                }
            });
            const recentRate = recentPossible > 0 ? (recentTotal / recentPossible) : 0;
            score += Math.round(recentRate * 140);

            // Factor 4: Momentum (10% weight) - Max +70 points
            const last3Days = Math.min(3, currentDay);
            let momentumTotal = 0;
            let momentumPossible = 0;
            allHabits.forEach(habit => {
                for (let i = Math.max(0, currentDay - last3Days); i < currentDay; i++) {
                    momentumPossible++;
                    if (habit[i] === 1) momentumTotal++;
                }
            });
            const momentumRate = momentumPossible > 0 ? (momentumTotal / momentumPossible) : 0;
            score += Math.round(momentumRate * 70);

            // Factor 5: Perfect days bonus (10% weight) - Max +70 points
            let perfectDays = 0;
            for (let day = 0; day < currentDay; day++) {
                let allComplete = true;
                allHabits.forEach(habit => {
                    if (habit[day] !== 1) allComplete = false;
                });
                if (allComplete) perfectDays++;
            }
            const perfectDayBonus = Math.min(70, perfectDays * 3); // 3 points per perfect day
            score += perfectDayBonus;

            // Cap score at 900
            score = Math.min(900, Math.round(score));

            // Determine rank
            let rank = 'Beginner';
            let rankEmoji = '🌱';
            if (score >= 850) {
                rank = 'Legendary';
                rankEmoji = '👑';
            } else if (score >= 800) {
                rank = 'Elite';
                rankEmoji = '💎';
            } else if (score >= 750) {
                rank = 'Master';
                rankEmoji = '🏆';
            } else if (score >= 700) {
                rank = 'Expert';
                rankEmoji = '⭐';
            } else if (score >= 650) {
                rank = 'Advanced';
                rankEmoji = '🔥';
            } else if (score >= 600) {
                rank = 'Proficient';
                rankEmoji = '💪';
            } else if (score >= 550) {
                rank = 'Developing';
                rankEmoji = '📈';
            } else if (score >= 500) {
                rank = 'Improving';
                rankEmoji = '🌟';
            } else if (score >= 450) {
                rank = 'Novice';
                rankEmoji = '🎯';
            } else {
                rank = 'Beginner';
                rankEmoji = '🌱';
            }

            return { score, rank, rankEmoji };
        }

        function updateDisciplineScore(data) {
            const disciplineData = calculateDisciplineScore(data.historic_habits, data.day_of_month);
            
            document.getElementById('disciplineValue').textContent = disciplineData.score;
            document.getElementById('disciplineEmoji').textContent = disciplineData.rankEmoji;
            document.getElementById('disciplineRank').textContent = disciplineData.rank;
            
            // Update circular progress ring
            const progressCircle = document.getElementById('progressCircle');
            const percentage = (disciplineData.score - 300) / 600; // 300-900 range
            const circumference = 283; // 2 * PI * 45
            const offset = circumference - (percentage * circumference);
            
            progressCircle.style.strokeDashoffset = offset;
            
            // Color based on score
            let strokeColor = '#4cd964'; // Default green
            
            if (disciplineData.score >= 850) {
                strokeColor = '#ff006e'; // Pink for Legendary
            } else if (disciplineData.score >= 800) {
                strokeColor = '#00d4ff'; // Cyan for Elite
            } else if (disciplineData.score >= 750) {
                strokeColor = '#ffd000'; // Gold for Master
            } else if (disciplineData.score >= 700) {
                strokeColor = '#667eea'; // Purple for Expert
            } else if (disciplineData.score >= 650) {
                strokeColor = '#ff9500'; // Orange for Advanced
            } else if (disciplineData.score >= 600) {
                strokeColor = '#4cd964'; // Green for Proficient
            } else if (disciplineData.score >= 500) {
                strokeColor = '#00d4ff'; // Cyan for Improving/Developing
            } else {
                strokeColor = '#888'; // Gray for beginners
            }
            
            progressCircle.style.stroke = strokeColor;
            
            // Update value gradient to match
            const valueElement = document.getElementById('disciplineValue');
            if (disciplineData.score >= 800) {
                valueElement.style.background = `linear-gradient(135deg, ${strokeColor} 0%, #fff 50%, ${strokeColor} 100%)`;
                valueElement.style.webkitBackgroundClip = 'text';
                valueElement.style.webkitTextFillColor = 'transparent';
            } else if (disciplineData.score >= 700) {
                valueElement.style.background = `linear-gradient(135deg, ${strokeColor} 0%, #fff 100%)`;
                valueElement.style.webkitBackgroundClip = 'text';
                valueElement.style.webkitTextFillColor = 'transparent';
            } else {
                valueElement.style.background = `linear-gradient(135deg, ${strokeColor} 0%, #888 100%)`;
                valueElement.style.webkitBackgroundClip = 'text';
                valueElement.style.webkitTextFillColor = 'transparent';
            }
        }

        function updateDateDisplay(dateString) {
            const date = new Date(dateString);
            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('dateDisplay').textContent = date.toLocaleDateString('en-US', options);
        }

        function updateStatsOverview(data) {
            const completed = data.habits.filter(h => h.done).length;
            const total = data.habits.length;
            const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

            // Get weekly and monthly goal percentages from API statistics
            const weeklyGoal = data.statistics.weekly_goal_percentage 
                ? Math.round(data.statistics.weekly_goal_percentage * 100) 
                : 0;
            const monthlyGoal = data.statistics.monthly_goal_percentage 
                ? Math.round(data.statistics.monthly_goal_percentage * 100) 
                : 0;

            document.getElementById('todayStats').textContent = `${completed}/${total}`;
            
            // Update rate with emoji if 100%
            if (rate === 100) {
                document.getElementById('rateStats').textContent = `${rate}% 🎯`;
            } else {
                document.getElementById('rateStats').textContent = `${rate}%`;
            }
            
            // Update weekly with emoji and special text if >100%
            if (weeklyGoal >= 200) {
                document.getElementById('weeklyGoalStats').innerHTML = `${weeklyGoal}% 🔥<div style="font-size: 0.5em; margin-top: 4px; color: #4cd964;">x${(weeklyGoal/100).toFixed(1)}</div>`;
            } else if (weeklyGoal >= 150) {
                document.getElementById('weeklyGoalStats').textContent = `${weeklyGoal}% 🚀`;
            } else if (weeklyGoal >= 100) {
                document.getElementById('weeklyGoalStats').textContent = `${weeklyGoal}% ✨`;
            } else {
                document.getElementById('weeklyGoalStats').textContent = `${weeklyGoal}%`;
            }
            
            // Update monthly with emoji and special text if >100%
            if (monthlyGoal >= 200) {
                document.getElementById('monthlyGoalStats').innerHTML = `${monthlyGoal}% 🔥<div style="font-size: 0.5em; margin-top: 4px; color: #4cd964;">x${(monthlyGoal/100).toFixed(1)}</div>`;
            } else if (monthlyGoal >= 150) {
                document.getElementById('monthlyGoalStats').textContent = `${monthlyGoal}% 🚀`;
            } else if (monthlyGoal >= 100) {
                document.getElementById('monthlyGoalStats').textContent = `${monthlyGoal}% ✨`;
            } else {
                document.getElementById('monthlyGoalStats').textContent = `${monthlyGoal}%`;
            }
            
            // Color code the stats
            const rateElement = document.getElementById('rateStats');
            const weeklyElement = document.getElementById('weeklyGoalStats');
            const monthlyElement = document.getElementById('monthlyGoalStats');
            
            // Add glow effect for >100%
            const rateCard = rateElement.parentElement;
            const weeklyCard = weeklyElement.parentElement;
            const monthlyCard = monthlyElement.parentElement;
            
            // Remove existing glow classes
            rateCard.classList.remove('stat-exceeding');
            weeklyCard.classList.remove('stat-exceeding');
            monthlyCard.classList.remove('stat-exceeding');
            
            // Rate color
            if (rate >= 100) {
                rateElement.style.color = '#4cd964';
                rateCard.classList.add('stat-exceeding');
            } else if (rate >= 80) {
                rateElement.style.color = '#4cd964';
            } else if (rate >= 60) {
                rateElement.style.color = '#667eea';
            } else if (rate >= 40) {
                rateElement.style.color = '#ff9500';
            } else {
                rateElement.style.color = '#ff3b30';
            }
            
            // Weekly goal color with gradient for >150%
            if (weeklyGoal >= 150) {
                weeklyElement.style.background = 'linear-gradient(135deg, #4cd964, #00d084)';
                weeklyElement.style.webkitBackgroundClip = 'text';
                weeklyElement.style.webkitTextFillColor = 'transparent';
                weeklyElement.style.backgroundClip = 'text';
                weeklyCard.classList.add('stat-exceeding');
            } else if (weeklyGoal >= 100) {
                weeklyElement.style.color = '#4cd964';
                weeklyElement.style.background = 'none';
                weeklyElement.style.webkitTextFillColor = '#4cd964';
                weeklyCard.classList.add('stat-exceeding');
            } else if (weeklyGoal >= 80) {
                weeklyElement.style.color = '#667eea';
                weeklyElement.style.background = 'none';
                weeklyElement.style.webkitTextFillColor = '#667eea';
            } else if (weeklyGoal >= 60) {
                weeklyElement.style.color = '#ff9500';
                weeklyElement.style.background = 'none';
                weeklyElement.style.webkitTextFillColor = '#ff9500';
            } else {
                weeklyElement.style.color = '#ff3b30';
                weeklyElement.style.background = 'none';
                weeklyElement.style.webkitTextFillColor = '#ff3b30';
            }
            
            // Monthly goal color with gradient for >150%
            if (monthlyGoal >= 150) {
                monthlyElement.style.background = 'linear-gradient(135deg, #4cd964, #00d084)';
                monthlyElement.style.webkitBackgroundClip = 'text';
                monthlyElement.style.webkitTextFillColor = 'transparent';
                monthlyElement.style.backgroundClip = 'text';
                monthlyCard.classList.add('stat-exceeding');
            } else if (monthlyGoal >= 100) {
                monthlyElement.style.color = '#4cd964';
                monthlyElement.style.background = 'none';
                monthlyElement.style.webkitTextFillColor = '#4cd964';
                monthlyCard.classList.add('stat-exceeding');
            } else if (monthlyGoal >= 80) {
                monthlyElement.style.color = '#667eea';
                monthlyElement.style.background = 'none';
                monthlyElement.style.webkitTextFillColor = '#667eea';
            } else if (monthlyGoal >= 60) {
                monthlyElement.style.color = '#ff9500';
                monthlyElement.style.background = 'none';
                monthlyElement.style.webkitTextFillColor = '#ff9500';
            } else {
                monthlyElement.style.color = '#ff3b30';
                monthlyElement.style.background = 'none';
                monthlyElement.style.webkitTextFillColor = '#ff3b30';
            }
        }

        function updateAnalyticsCards(data) {
            const { historic_habits, days_in_month, day_of_month } = data;
            
            // Calculate analytics
            const consistencyData = calculateConsistency(historic_habits, day_of_month);
            const weeklyData = calculateWeeklyAverage(historic_habits, day_of_month);
            const trendData = calculateTrend(historic_habits, day_of_month);

            const analyticsGrid = document.getElementById('analyticsGrid');
            analyticsGrid.innerHTML = `
                ${createConsistencyCard(consistencyData)}
                ${createWeeklyAverageCard(weeklyData)}
                ${createTrendCard(trendData)}
            `;
        }

        function calculateConsistency(historicHabits, currentDay) {
            const allHabits = Object.values(historicHabits);
            if (allHabits.length === 0) return { rate: 0, change: 0, weeklyData: [] };

            // Calculate overall consistency
            let totalChecks = 0;
            let totalPossible = 0;

            allHabits.forEach(habit => {
                for (let i = 0; i < currentDay; i++) {
                    totalPossible++;
                    if (habit[i] === 1) totalChecks++;
                }
            });

            const currentRate = totalPossible > 0 ? (totalChecks / totalPossible) * 100 : 0;

            // Calculate last week vs previous week
            const lastWeekStart = Math.max(0, currentDay - 7);
            const prevWeekStart = Math.max(0, currentDay - 14);

            let lastWeekTotal = 0, lastWeekPossible = 0;
            let prevWeekTotal = 0, prevWeekPossible = 0;

            allHabits.forEach(habit => {
                for (let i = lastWeekStart; i < currentDay; i++) {
                    lastWeekPossible++;
                    if (habit[i] === 1) lastWeekTotal++;
                }
                for (let i = prevWeekStart; i < lastWeekStart; i++) {
                    prevWeekPossible++;
                    if (habit[i] === 1) prevWeekTotal++;
                }
            });

            const lastWeekRate = lastWeekPossible > 0 ? (lastWeekTotal / lastWeekPossible) * 100 : 0;
            const prevWeekRate = prevWeekPossible > 0 ? (prevWeekTotal / prevWeekPossible) * 100 : 0;
            const change = lastWeekRate - prevWeekRate;

            // Calculate daily consistency for chart
            const weeklyData = [];
            const daysToShow = Math.min(14, currentDay);
            for (let i = currentDay - daysToShow; i < currentDay; i++) {
                let dayTotal = 0;
                allHabits.forEach(habit => {
                    if (habit[i] === 1) dayTotal++;
                });
                weeklyData.push((dayTotal / allHabits.length) * 100);
            }

            return { rate: currentRate, change, weeklyData };
        }

        function calculateWeeklyAverage(historicHabits, currentDay) {
            const allHabits = Object.values(historicHabits);
            if (allHabits.length === 0) return { average: 0, change: 0, weeklyData: [] };

            // Calculate last 7 days average
            const lastWeekStart = Math.max(0, currentDay - 7);
            let lastWeekTotal = 0;
            let lastWeekCount = 0;

            allHabits.forEach(habit => {
                for (let i = lastWeekStart; i < currentDay; i++) {
                    lastWeekCount++;
                    if (habit[i] === 1) lastWeekTotal++;
                }
            });

            const lastWeekAvg = lastWeekCount > 0 ? (lastWeekTotal / lastWeekCount) * 100 : 0;

            // Calculate previous 7 days average
            const prevWeekStart = Math.max(0, currentDay - 14);
            let prevWeekTotal = 0;
            let prevWeekCount = 0;

            allHabits.forEach(habit => {
                for (let i = prevWeekStart; i < lastWeekStart; i++) {
                    prevWeekCount++;
                    if (habit[i] === 1) prevWeekTotal++;
                }
            });

            const prevWeekAvg = prevWeekCount > 0 ? (prevWeekTotal / prevWeekCount) * 100 : 0;
            const change = lastWeekAvg - prevWeekAvg;

            // Generate daily averages for last 14 days
            const weeklyData = [];
            const daysToShow = Math.min(14, currentDay);
            for (let i = currentDay - daysToShow; i < currentDay; i++) {
                let dayTotal = 0;
                allHabits.forEach(habit => {
                    if (habit[i] === 1) dayTotal++;
                });
                weeklyData.push((dayTotal / allHabits.length) * 100);
            }

            return { average: lastWeekAvg, change, weeklyData };
        }

        function calculateTrend(historicHabits, currentDay) {
            const allHabits = Object.values(historicHabits);
            if (allHabits.length === 0) return { direction: 'neutral', percentage: 0, weeklyTrend: [] };

            // Calculate last 7 days vs previous 7 days
            const recentStart = Math.max(0, currentDay - 7);
            const olderStart = Math.max(0, currentDay - 14);

            let recentTotal = 0, recentPossible = 0;
            let olderTotal = 0, olderPossible = 0;

            allHabits.forEach(habit => {
                for (let i = recentStart; i < currentDay; i++) {
                    recentPossible++;
                    if (habit[i] === 1) recentTotal++;
                }
                for (let i = olderStart; i < recentStart; i++) {
                    olderPossible++;
                    if (habit[i] === 1) olderTotal++;
                }
            });

            const recentRate = recentPossible > 0 ? (recentTotal / recentPossible) * 100 : 0;
            const olderRate = olderPossible > 0 ? (olderTotal / olderPossible) * 100 : 0;
            const change = recentRate - olderRate;

            const direction = change > 0 ? 'positive' : change < 0 ? 'negative' : 'neutral';

            // Generate weekly trend data
            const weeklyTrend = [];
            const weeksToShow = Math.min(4, Math.floor(currentDay / 7));
            
            for (let week = 0; week < weeksToShow; week++) {
                const weekEnd = currentDay - (week * 7);
                const weekStart = Math.max(0, weekEnd - 7);
                
                let weekTotal = 0, weekPossible = 0;
                allHabits.forEach(habit => {
                    for (let i = weekStart; i < weekEnd; i++) {
                        weekPossible++;
                        if (habit[i] === 1) weekTotal++;
                    }
                });
                
                weeklyTrend.unshift(weekPossible > 0 ? (weekTotal / weekPossible) * 100 : 0);
            }

            return { direction, percentage: Math.abs(change), weeklyTrend };
        }

        function createConsistencyCard(data) {
            const trendClass = data.change > 0 ? 'positive' : data.change < 0 ? 'negative' : 'neutral';
            const trendSymbol = data.change > 0 ? '↑' : data.change < 0 ? '↓' : '→';
            
            // Color code the consistency rate
            let rateColor = '#888';
            let rateText = 'Poor';
            if (data.rate >= 90) {
                rateColor = '#4cd964';
                rateText = 'Excellent';
            } else if (data.rate >= 80) {
                rateColor = '#4cd964';
                rateText = 'Great';
            } else if (data.rate >= 70) {
                rateColor = '#667eea';
                rateText = 'Good';
            } else if (data.rate >= 60) {
                rateColor = '#667eea';
                rateText = 'Fair';
            } else if (data.rate >= 50) {
                rateColor = '#ff9500';
                rateText = 'Average';
            } else if (data.rate >= 40) {
                rateColor = '#ff9500';
                rateText = 'Below Average';
            } else if (data.rate >= 30) {
                rateColor = '#ff3b30';
                rateText = 'Weak';
            } else {
                rateColor = '#ff3b30';
                rateText = 'Critical';
            }
            
            return `
                <div class="analytics-card">
                    <div class="card-header">
                        <div class="card-title">Consistency</div>
                        <div class="card-trend ${trendClass}">${trendSymbol} ${Math.abs(data.change).toFixed(1)}%</div>
                    </div>
                    <div class="card-value" style="color: ${rateColor}">${data.rate.toFixed(0)}%</div>
                    <div class="card-subtitle">${rateText} • vs last week</div>
                    <div class="chart-container">
                        <canvas class="mini-chart" id="consistencyChart"></canvas>
                    </div>
                </div>
            `;
        }

        function createWeeklyAverageCard(data) {
            const trendClass = data.change > 0 ? 'positive' : data.change < 0 ? 'negative' : 'neutral';
            const trendSymbol = data.change > 0 ? '↑' : data.change < 0 ? '↓' : '→';
            
            // Color code the weekly average
            let avgColor = '#888';
            if (data.average >= 80) avgColor = '#4cd964';
            else if (data.average >= 60) avgColor = '#667eea';
            else if (data.average >= 40) avgColor = '#ff9500';
            else avgColor = '#ff3b30';
            
            return `
                <div class="analytics-card">
                    <div class="card-header">
                        <div class="card-title">Weekly Average</div>
                        <div class="card-trend ${trendClass}">${trendSymbol} ${Math.abs(data.change).toFixed(1)}%</div>
                    </div>
                    <div class="card-value" style="color: ${avgColor}">${data.average.toFixed(0)}%</div>
                    <div class="card-subtitle">last 7 days performance</div>
                    <div class="chart-container">
                        <canvas class="mini-chart" id="weeklyChart"></canvas>
                    </div>
                </div>
            `;
        }

        function createTrendCard(data) {
            const trendSymbol = data.direction === 'positive' ? '↑' : data.direction === 'negative' ? '↓' : '→';
            
            // Determine trend level and color based on percentage change
            let trendText = 'Stable';
            let trendColor = '#888';
            
            if (data.direction === 'positive') {
                if (data.percentage >= 20) {
                    trendText = 'Surging';
                    trendColor = '#4cd964';
                } else if (data.percentage >= 10) {
                    trendText = 'Rising Fast';
                    trendColor = '#4cd964';
                } else if (data.percentage >= 5) {
                    trendText = 'Improving';
                    trendColor = '#4cd964';
                } else {
                    trendText = 'Slightly Up';
                    trendColor = '#667eea';
                }
            } else if (data.direction === 'negative') {
                if (data.percentage >= 20) {
                    trendText = 'Crashing';
                    trendColor = '#ff3b30';
                } else if (data.percentage >= 10) {
                    trendText = 'Falling Fast';
                    trendColor = '#ff3b30';
                } else if (data.percentage >= 5) {
                    trendText = 'Declining';
                    trendColor = '#ff9500';
                } else {
                    trendText = 'Slightly Down';
                    trendColor = '#ff9500';
                }
            } else {
                trendText = 'Stable';
                trendColor = '#888';
            }
            
            return `
                <div class="analytics-card">
                    <div class="card-header">
                        <div class="card-title">7-Day Trend</div>
                        <div class="card-trend ${data.direction}">${trendSymbol} ${data.percentage.toFixed(1)}%</div>
                    </div>
                    <div class="card-value" style="color: ${trendColor}">${trendText}</div>
                    <div class="card-subtitle">vs previous week</div>
                    <div class="chart-container">
                        <canvas class="mini-chart" id="trendChart"></canvas>
                    </div>
                </div>
            `;
        }

        function displayHabits(data) {
            const container = document.getElementById('habitsContainer');
            
            if (!data.habits || data.habits.length === 0) {
                container.innerHTML = '<div class="loading">No habits found</div>';
                return;
            }

            container.innerHTML = data.habits.map((habit, index) => {
                const history = data.historic_habits[habit.habit] || [];
                const last7Days = history.slice(Math.max(0, data.day_of_month - 7), data.day_of_month);
                const completed = last7Days.filter(v => v === 1).length;
                const rate = last7Days.length > 0 ? Math.round((completed / last7Days.length) * 100) : 0;
                
                // Color coding for percentage
                let rateColor = '#888';
                if (rate >= 80) rateColor = '#4cd964';
                else if (rate >= 60) rateColor = '#667eea';
                else if (rate >= 40) rateColor = '#ff9500';
                else rateColor = '#ff3b30';

                return `
                    <div class="habit-item ${habit.done ? 'completed' : ''}" onclick="toggleHabit(${habit.id}, ${!habit.done})">
                        <div class="habit-checkbox ${habit.done ? 'checked' : ''}"></div>
                        <div class="habit-info">
                            <div class="habit-name">${habit.habit}</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <canvas class="habit-mini-progress" id="habitChart${index}"></canvas>
                            <div style="color: ${rateColor}; font-weight: 600; font-size: 0.95em; min-width: 45px; text-align: right;">${rate}%</div>
                        </div>
                    </div>
                `;
            }).join('');

            // Draw mini progress charts
            setTimeout(() => {
                data.habits.forEach((habit, index) => {
                    const history = data.historic_habits[habit.habit] || [];
                    const last7Days = history.slice(Math.max(0, data.day_of_month - 7), data.day_of_month);
                    drawMiniChart(`habitChart${index}`, last7Days);
                });

                // Draw analytics charts
                const consistencyData = calculateConsistency(data.historic_habits, data.day_of_month);
                const weeklyData = calculateWeeklyAverage(data.historic_habits, data.day_of_month);
                const trendData = calculateTrend(data.historic_habits, data.day_of_month);

                drawLineChart('consistencyChart', consistencyData.weeklyData, '#667eea');
                drawLineChart('weeklyChart', weeklyData.weeklyData, '#4cd964');
                drawLineChart('trendChart', trendData.weeklyTrend, '#764ba2');
            }, 100);
        }

        function drawMiniChart(canvasId, data) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const width = canvas.width = canvas.offsetWidth * 2;
            const height = canvas.height = canvas.offsetHeight * 2;

            ctx.clearRect(0, 0, width, height);

            const barWidth = width / data.length;
            
            data.forEach((value, index) => {
                ctx.fillStyle = value === 1 ? '#667eea' : '#2a2a2a';
                ctx.fillRect(index * barWidth + 2, 0, barWidth - 4, height);
            });
        }

        function drawLineChart(canvasId, data, color) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const width = canvas.width = canvas.offsetWidth * 2;
            const height = canvas.height = canvas.offsetHeight * 2;

            ctx.clearRect(0, 0, width, height);

            if (data.length === 0) return;

            const max = Math.max(...data, 1);
            const min = Math.min(...data, 0);
            const range = max - min || 1;

            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            data.forEach((value, index) => {
                const x = (index / (data.length - 1)) * width;
                const y = height - ((value - min) / range) * height;

                if (index === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });
            ctx.stroke();

            // Fill area under line
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.closePath();
            ctx.fillStyle = color + '20';
            ctx.fill();
        }


        async function toggleHabit(habitId, checked) {
            if (!API_SECRET) {
                showToast('Please enter your API secret key first', 'error');
                return;
            }

            // Optimistic UI update - update immediately
            const habitItems = document.querySelectorAll('.habit-item');
            let targetHabit = null;
            
            habitItems.forEach(item => {
                const checkbox = item.querySelector('.habit-checkbox');
                const habitInfo = item.querySelector('.habit-info');
                const habitName = habitInfo?.querySelector('.habit-name')?.textContent;
                
                // Find matching habit by comparing with current data
                if (currentData && currentData.habits) {
                    const matchingHabit = currentData.habits.find(h => h.id === habitId);
                    if (matchingHabit && habitName === matchingHabit.habit) {
                        targetHabit = item;
                    }
                }
            });

            if (targetHabit) {
                const checkbox = targetHabit.querySelector('.habit-checkbox');
                
                // Update UI immediately
                if (checked) {
                    targetHabit.classList.add('completed');
                    checkbox.classList.add('checked');
                } else {
                    targetHabit.classList.remove('completed');
                    checkbox.classList.remove('checked');
                }
                
                // Update today's stats immediately
                updateTodayStatsOptimistic(checked);
            }

            // Then make API call in background
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        api_secret: API_SECRET,
                        habit_id: habitId,
                        checked: checked
                    })
                });

                // Wait a moment, then refresh to get accurate stats
                setTimeout(() => {
                    loadData();
                }, 1000);

            } catch (error) {
                console.error('Error toggling habit:', error);
                showToast('Failed to update habit', 'error');
                
                // Revert UI on error
                if (targetHabit) {
                    const checkbox = targetHabit.querySelector('.habit-checkbox');
                    if (!checked) {
                        targetHabit.classList.add('completed');
                        checkbox.classList.add('checked');
                    } else {
                        targetHabit.classList.remove('completed');
                        checkbox.classList.remove('checked');
                    }
                    updateTodayStatsOptimistic(!checked);
                }
            }
        }

        function updateTodayStatsOptimistic(checked) {
            const todayStatsEl = document.getElementById('todayStats');
            const rateStatsEl = document.getElementById('rateStats');
            const currentText = todayStatsEl.textContent;
            const [completed, total] = currentText.split('/').map(n => parseInt(n));
            
            const newCompleted = checked ? completed + 1 : completed - 1;
            const newRate = total > 0 ? Math.round((newCompleted / total) * 100) : 0;
            
            todayStatsEl.textContent = `${newCompleted}/${total}`;
            
            // Add emoji for 100%
            if (newRate === 100) {
                rateStatsEl.textContent = `${newRate}% 🎯`;
            } else {
                rateStatsEl.textContent = `${newRate}%`;
            }
            
            // Update rate color
            if (newRate >= 80) rateStatsEl.style.color = '#4cd964';
            else if (newRate >= 60) rateStatsEl.style.color = '#667eea';
            else if (newRate >= 40) rateStatsEl.style.color = '#ff9500';
            else rateStatsEl.style.color = '#ff3b30';
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
