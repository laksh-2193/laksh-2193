<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <title>404 — page not found</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F5F5F7'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='ui-monospace,monospace' font-size='15' font-weight='700' fill='%230A0A0B'%3ELK%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=2.2">
  <style>
    .e404 {
      min-height: 100dvh;
      display: grid; place-items: center;
      text-align: center;
      padding: var(--s-7) var(--s-5);
    }
    .e404-num {
      font-family: var(--f-sans); font-weight: 300;
      font-size: clamp(8rem, 24vw, 16rem);
      line-height: 0.85;
      letter-spacing: -0.06em;
      color: var(--ink);
      margin-bottom: var(--s-4);
    }
    .e404-num em {
      font-family: var(--f-serif);
      font-style: italic;
      font-weight: 400;
    }
    .e404 p {
      color: var(--ink-dim); font-size: 1rem; max-width: 50ch;
      margin: 0 auto var(--s-6);
      line-height: 1.55;
    }
    .e404 .meta {
      font-family: var(--f-mono); font-size: 11px;
      color: var(--ink-mute); letter-spacing: 0.14em; text-transform: uppercase;
      margin-bottom: var(--s-5);
    }
    .e404 .row { display: flex; gap: var(--s-3); justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-noise"></div>

  <main class="e404">
    <div>
      <div class="meta">// agent · 404 · path not resolved</div>
      <div class="e404-num">4<em>0</em>4</div>
      <p>The agent looked everywhere — index, work, agents, talks. This page isn't in the registry. Most likely it moved, or the URL has a typo.</p>
      <div class="row">
        <a href="index.html" class="btn btn-primary">
          back to index
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
        </a>
        <a href="contact.html" class="btn btn-ghost">report it</a>
      </div>
    </div>
  </main>

  <script src="script.js?v=2.2"></script>
</body>
</html>
